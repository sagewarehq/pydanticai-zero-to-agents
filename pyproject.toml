[project]
name = "pydanticai-zero-to-agents"
version = "0.1.0"
description = "Zero to Agents: reference examples for building an agentic harness with Pydantic AI (PythonAsia 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "numpy>=2.5.4",
    "pydantic-ai[ag-ui]>=2.57.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long strings and data rows read better unwrapped

[tool.ruff.format]
quote-style = "single"
